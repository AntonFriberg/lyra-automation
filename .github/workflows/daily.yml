name: Daily pipeline

on:
  schedule:
    - cron: "45 7 * * *"
      timezone: "Europe/Stockholm"
  workflow_dispatch:

permissions: read-all

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          prune-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Get Playwright version
        id: playwright-version
        run: |
          echo "version=$(uv run python -c 'from importlib.metadata import version; print(version("playwright"))')" >> $GITHUB_OUTPUT

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            uv run playwright install chromium          # binary cached; skip OS deps
          else
            uv run playwright install --with-deps chromium
          fi

      - name: Run daily pipeline
        env:
          LYRA_EMAIL: ${{ secrets.LYRA_EMAIL }}
          LYRA_PASSWORD: ${{ secrets.LYRA_PASSWORD }}
          JM_EMAIL: ${{ secrets.JM_EMAIL }}
          JM_PASSWORD: ${{ secrets.JM_PASSWORD }}
          SEAM_API_KEY: ${{ secrets.SEAM_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          HEADLESS: "true"
        run: uv run python -m lyra daily

      - name: Notify failure
        if: failure()
        run: |
          uv run python -c "
          import smtplib
          from email.mime.text import MIMEText
          import os
          user = os.environ['GMAIL_USER']
          msg = MIMEText(
              f'lyra daily pipeline failed.\n\n'
              f'See: https://github.com/{os.environ[\"GITHUB_REPOSITORY\"]}'
              f'/actions/runs/{os.environ[\"GITHUB_RUN_ID\"]}',
              'plain', 'utf-8',
          )
          msg['From'] = user
          msg['To'] = user
          msg['Subject'] = 'FAILED: lyra daily pipeline'
          with smtplib.SMTP('smtp.gmail.com', 587, timeout=30) as s:
              s.starttls()
              s.login(user, os.environ['GMAIL_APP_PASSWORD'])
              s.send_message(msg)
          "
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
